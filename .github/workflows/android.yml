name: Android CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true # pinned llama.cpp

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.1" "ndk;29.0.14206865" "cmake;3.31.6" > /dev/null

      # Two versions since 1.3 (full and play), so every task names its version.
      - name: Unit tests (both versions)
        run: ./gradlew :app:testFullDebugUnitTest :app:testPlayDebugUnitTest

      - name: Upload theme screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theme-screenshots
          path: app/build/outputs/screenshots/*.png
          if-no-files-found: ignore

      - name: Lint (both versions)
        run: ./gradlew :app:lintFullDebug :app:lintPlayDebug

      # Release builds with R8. The play one also runs verifyPlayReleasePlayPolicy. Without the
      # signing key (never in the repository) the APKs are left unsigned.
      - name: Assemble release (R8, Play policy check)
        run: ./gradlew :app:assembleFullRelease :app:assemblePlayRelease

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: app/build/outputs/apk/**/*.apk
